[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "annotated-vcf-to-csv"
version = "0.1.1"
description = "Export annotated VCF records and carrier samples to analysis-ready CSV."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "cyvcf2>=0.34,<1",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
vcf-to-csv = "vcf_to_csv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
