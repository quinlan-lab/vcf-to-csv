[vep]
info_field = "CSQ"
required = true
# Set output_column to opt into a lossless JSON column containing every VEP
# annotation. Omit it for conventional flat CSV output.
# output_column = "vep_annotations"
# include_fields = ["Allele", "Consequence", "IMPACT", "SYMBOL", "HGVSc", "HGVSp"]

# Additional columns can come from a VEP CSQ subfield or a top-level INFO
# field. Set required=false for fields that are optional across VCFs.
[[columns]]
name = "genes"
source = "vep"
field = "SYMBOL"
aggregate = "join"
separator = ";"

[[columns]]
name = "consequences"
source = "vep"
field = "Consequence"
aggregate = "join"
separator = ";"

[[columns]]
name = "transcripts"
source = "vep"
field = "Feature"
aggregate = "join"
separator = ";"

[[columns]]
name = "hgvsc"
source = "vep"
field = "HGVSc"
aggregate = "join"
separator = ";"

[[columns]]
name = "hgvsp"
source = "vep"
field = "HGVSp"
aggregate = "join"
separator = ";"

[[columns]]
name = "gnomad_exomes_af"
source = "vep"
field = "gnomADe_AF"
aggregate = "max"
required = false

[[columns]]
name = "gnomad_genomes_af"
source = "vep"
field = "gnomADg_AF"
aggregate = "max"
required = false

[[columns]]
name = "clinvar_significance"
source = "info"
field = "CLNSIG"
aggregate = "join"
separator = ";"
required = false
