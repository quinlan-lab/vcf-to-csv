[vep]
info_field = "CSQ"
required = false
# If this VCF had been annotated by VEP, change required to true and optionally
# select the fields stored in the vep_annotations JSON output column:
# include_fields = ["Allele", "Consequence", "IMPACT", "SYMBOL"]

[[columns]]
name = "global_af"
source = "info"
field = "AF"
aggregate = "first"

[[columns]]
name = "east_asian_af"
source = "info"
field = "EAS_AF"
aggregate = "first"

[[columns]]
name = "european_af"
source = "info"
field = "EUR_AF"
aggregate = "first"

[[columns]]
name = "variant_type"
source = "info"
field = "VT"
aggregate = "join"

# A VEP subfield can also become its own CSV column. If CSQ were present,
# uncommenting this entry would add a semicolon-separated list such as
# "missense_variant;splice_region_variant" to the consequence column.
#
# [[columns]]
# name = "consequence"
# source = "vep"
# field = "Consequence"
# aggregate = "join"
# separator = ";"
# required = true
